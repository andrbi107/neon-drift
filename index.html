<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Drift">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Neon Drift</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <canvas id="game" width="375" height="667" aria-label="Neon Drift game canvas"></canvas>

    <!-- HUD overlay (visible only while playing / paused) -->
    <div id="hud" class="hud" aria-hidden="true">
      <div class="hud-left">
        <div class="hud-score">SCORE <span id="scoreVal">0</span></div>
        <div class="hud-best">BEST <span id="bestVal">0</span></div>
      </div>
      <div class="hud-right">
        <div class="hud-speed">SPEED <span id="speedVal">1.0x</span></div>
        <button id="pauseBtn" class="icon-btn" type="button" aria-label="Pause">II</button>
      </div>
    </div>

    <!-- Boost meter (visible while playing) -->
    <div id="boostMeter" class="boost-meter" aria-hidden="true">
      <div class="boost-label">BOOST</div>
      <div class="boost-bar"><div id="boostFill" class="boost-fill"></div></div>
    </div>

    <!-- On-screen touch controls -->
    <div id="touchControls" class="touch-controls" aria-hidden="true">
      <button id="leftBtn" class="lane-btn" type="button" aria-label="Move left">&#9664;</button>
      <button id="boostBtn" class="boost-btn" type="button" aria-label="Boost">BOOST</button>
      <button id="rightBtn" class="lane-btn" type="button" aria-label="Move right">&#9654;</button>
    </div>

    <!-- Start screen -->
    <div id="startScreen" class="screen active">
      <h1 class="title">NEON DRIFT</h1>
      <p class="tagline">3-LANE SYNTHWAVE RACER</p>
      <div class="best-line">BEST <span id="startBest">0</span></div>
      <button id="playBtn" class="primary-btn" type="button">PLAY</button>
      <p class="hint">Arrows / A&#183;D to switch lanes &middot; Space to boost &middot; P to pause</p>
    </div>

    <!-- Pause screen -->
    <div id="pauseScreen" class="screen">
      <h2 class="title sm">PAUSED</h2>
      <button id="resumeBtn" class="primary-btn" type="button">RESUME</button>
      <button id="quitBtn" class="ghost-btn" type="button">QUIT TO MENU</button>
    </div>

    <!-- Game over screen -->
    <div id="overScreen" class="screen">
      <h2 class="title sm over-title">SYSTEM HALT</h2>
      <div class="score-block">
        <div class="score-row">SCORE <span id="finalScore">0</span></div>
        <div class="score-row best-row">BEST <span id="finalBest">0</span></div>
        <div id="newRecord" class="new-record" aria-hidden="true">NEW RECORD</div>
      </div>
      <button id="retryBtn" class="primary-btn" type="button">RETRY</button>
      <button id="homeBtn" class="ghost-btn" type="button">HOME</button>
    </div>
  </div>

  <script src="vendor/howler.min.js"></script>
  <script src="mobile-ux.js"></script>
  <script src="gamekit.js"></script>
  <script src="main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
